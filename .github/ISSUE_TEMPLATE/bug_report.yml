name: Bug report
description: Report a reproducible issue in ClaudGPT
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include Telegram tokens, API keys, database files, or private user data."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the issue.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.x"
  - type: input
    id: hosting
    attributes:
      label: Hosting environment
      placeholder: "Kali Linux / Render / Other"
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove all tokens, IDs that identify private users, and personal data.
