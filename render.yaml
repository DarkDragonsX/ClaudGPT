services:
  - type: web
    name: claudgpt
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        value: "0"
      - key: AI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
